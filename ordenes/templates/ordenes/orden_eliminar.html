{% extends 'productos/base.html' %}

{% block titulo %}Eliminar orden{% endblock %}

{% block contenido %}
<h1>Eliminar orden</h1>

<p>Seguro que quieres eliminar la orden <b>#{{ orden.id }}</b> por <b>${{ orden.total }}</b>?</p>
<p>Esta accion no se puede deshacer.</p>

<form method="post">
    {% csrf_token %}
    <p class="acciones">
        <button type="submit">Si, eliminar orden</button>
        <a href="{% url 'ordenes:orden_detalle' orden.id %}">Volver</a>
    </p>
</form>
{% endblock %}
