<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}MarketHub{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            padding: 15px 25px;
        }

        header h2 {
            margin: 0;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .panel {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
        }

        .btn {
            display: inline-block;
            background-color: #087f8c;
            color: white;
            padding: 9px 14px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #06636d;
        }

        .btn-claro {
            background-color: white;
            color: #333;
            border: 1px solid #ccc;
        }

        .btn-claro:hover {
            background-color: #eee;
        }

        .btn-peligro {
            background-color: #c0392b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #eee;
        }

        .col-acciones {
            white-space: nowrap;
            text-align: right;
        }

        .col-acciones form {
            display: inline;
        }

        .nombre {
            font-weight: bold;
        }

        .vacio, .resumen {
            color: #777;
        }

        .estado {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        .estado-activo {
            background-color: #d4edda;
            color: #155724;
        }

        .estado-inactivo {
            background-color: #eee;
            color: #666;
        }

        .estado-vacio {
            text-align: center;
            padding: 35px 15px;
            color: #777;
        }

        .estado-vacio strong {
            display: block;
            color: #333;
            margin-bottom: 8px;
        }

        .formulario {
            padding: 25px;
            max-width: 550px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .check label {
            margin: 0;
        }

        .acciones-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .aviso {
            padding: 25px;
            max-width: 550px;
        }

        @media (max-width: 600px) {
            main {
                margin-top: 20px;
            }

            th, td {
                padding: 8px;
            }

            .col-acciones {
                white-space: normal;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>MarketHub</h2>
    </header>

    <main>
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
