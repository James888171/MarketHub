{% extends 'productos/base.html' %}

{% block titulo %}Eliminar categoría{% endblock %}

{% block contenido %}
<h1>Eliminar categoría</h1>

<div class="panel aviso">
    <p>¿Seguro que quieres eliminar la categoría <strong>{{ categoria.nombre }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <div class="acciones-form">
            <button class="btn btn-peligro" type="submit">Sí, eliminar</button>
            <a class="btn btn-claro" href="{% url 'productos:categoria_listar' %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
