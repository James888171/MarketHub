{% extends 'productos/base.html' %}

{% block titulo %}{{ titulo }} MarketHub{% endblock %}

{% block contenido %}
<h1> Nueva categoría </h1>

<div class="panel formulario">
    {% if error %}
        <div class="error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" maxlength="255" value="{{ categoria.nombre|default:'' }}" required>
        </div>

        <div class="campo">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion">{{ categoria.descripcion|default:'' }}</textarea>
        </div>

        <div class="campo check">
            <input type="checkbox" id="activo" name="activo" {% if categoria.activo %}checked{% endif %}>
            <label for="activo">Categoría activa</label>
        </div>

        <div class="acciones-form">
            <button class="btn" type="submit">{{ boton }}</button>
            <a class="btn btn-claro" href="{% url 'productos:categoria_listar' %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
