{% extends 'productos/base.html' %}

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
<h1>Crear cuenta</h1>

{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <p>
        <label for="nombre">Nombre</label><br>
        <input type="text" id="nombre" name="nombre" value="{{ datos.nombre }}" required>
    </p>

    <p>
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" value="{{ datos.email }}" required>
    </p>

    <p>
        <label for="password">Contraseña</label><br>
        <input type="password" id="password" name="password" required>
    </p>

    <p>
        <label for="confirmar">Confirmar contraseña</label><br>
        <input type="password" id="confirmar" name="confirmar" required>
    </p>

    <p>
        <label for="calle">Calle (opcional)</label><br>
        <input type="text" id="calle" name="calle" value="{{ datos.calle }}">
    </p>

    <p>
        <label for="ciudad">Ciudad (opcional)</label><br>
        <input type="text" id="ciudad" name="ciudad" value="{{ datos.ciudad }}">
    </p>

    <button type="submit">Crear cuenta</button>
</form>

<p>Ya tienes cuenta? <a href="{% url 'usuarios:ingresar' %}">Inicia sesion</a></p>
{% endblock %}
